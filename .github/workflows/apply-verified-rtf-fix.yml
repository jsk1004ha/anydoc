name: Apply verified RTF review fix

on:
  push:
    branches:
      - fix/bound-csv-rtf-materialization

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Restore previously verified RTF source
        shell: bash
        run: |
          set -euo pipefail
          base='https://raw.githubusercontent.com/jsk1004ha/k6-operator/agent/anydoc-generated-output/.agent-output'
          : > /tmp/rtf-mod.rs.b64
          for i in $(seq 0 19); do
            part=$(printf '%03d' "$i")
            curl --fail --silent --show-error --location \
              "$base/rtf-$part.part" >> /tmp/rtf-mod.rs.b64
          done
          base64 --decode /tmp/rtf-mod.rs.b64 > /tmp/rtf-mod.rs
          echo 'b1acc66de414e13c1a4201156a2d28f518d61ebb6352281a9b28f05f2c6bfed8  /tmp/rtf-mod.rs' | sha256sum --check
          test "$(wc -c < /tmp/rtf-mod.rs)" -eq 44225
          cp /tmp/rtf-mod.rs src/formats/rtf/mod.rs

      - name: Format and verify
        run: |
          cargo fmt --all
          cargo fmt --all -- --check
          cargo test --locked
          cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Commit verified source and remove temporary workflow
        run: |
          rm .github/workflows/apply-verified-rtf-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: address remaining RTF materialization review feedback'
          git push origin HEAD:fix/bound-csv-rtf-materialization
