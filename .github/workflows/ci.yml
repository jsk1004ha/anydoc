name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust
    runs-on: blacksmith-8vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      # Root package only: the node/ and python/ binding crates are cdylib-only
      # and their test harnesses cannot link outside a Node/Python host; they
      # are covered by the node and python jobs instead.
      - run: cargo test --locked

  node:
    name: Node bindings
    runs-on: blacksmith-8vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: node/package-lock.json
      - run: npm ci
        working-directory: node
      - run: npm run build
        working-directory: node
      - run: npm test
        working-directory: node
      - name: Committed bindings are up to date
        # `npm run build` regenerates index.js / index.d.ts; any diff means the
        # committed generated bindings are stale and must be rebuilt and committed.
        run: |
          if ! git diff --exit-code -- node/index.js node/index.d.ts; then
            echo "::error::node/index.js or node/index.d.ts is out of date. Run 'npm run build' in node/ and commit the result."
            exit 1
          fi

  wasm:
    name: Wasm bindings
    runs-on: blacksmith-8vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: wasm32-unknown-unknown
      - run: cargo clippy -p anydoc-wasm --target wasm32-unknown-unknown -- -D warnings
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - name: Install wasm-pack
        run: >
          curl -sSfL https://github.com/wasm-bindgen/wasm-pack/releases/download/v0.15.0/wasm-pack-v0.15.0-x86_64-unknown-linux-musl.tar.gz
          | tar xz --strip-components=1 -C /usr/local/bin wasm-pack-v0.15.0-x86_64-unknown-linux-musl/wasm-pack
      - run: wasm-pack build wasm --release --target web --scope firecrawl
      - run: node --test wasm/test.mjs

  python:
    name: Python bindings
    runs-on: blacksmith-8vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: pip install maturin
      - run: maturin build --release --locked --manifest-path python/Cargo.toml --out dist
      - run: pip install --no-index --find-links dist firecrawl-anydoc
      # Must run from the repo root: with python/ as cwd, the source anydoc/
      # package dir shadows the installed compiled module.
      - run: python -m unittest discover -s python/tests

  agent-review-fix:
    name: Apply and verify review fixes
    if: github.event_name == 'pull_request' && github.head_ref == 'agent/trigger-anydoc-main-runner'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/bound-csv-rtf-materialization
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Apply review fixes and regression tests
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path: Path, old: str, new: str) -> None:
              text = path.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one match, found {count}\n--- needle ---\n{old}")
              path.write_text(text.replace(old, new, 1))

          csv = Path("src/formats/csv.rs")
          replace_once(
              csv,
              "        let mut cells = Vec::with_capacity(record.len());",
              "        let mut cells = Vec::new();",
          )

          rtf = Path("src/formats/rtf/mod.rs")
          replace_once(
              rtf,
              """    fn end_paragraph(&mut self) -> Result<(), ConvertError> {
        let inlines = std::mem::take(&mut self.inlines);""",
              """    fn end_paragraph(&mut self) -> Result<(), ConvertError> {
        if let Some(error) = self.materialization_error.take() {
            return Err(error);
        }
        let inlines = std::mem::take(&mut self.inlines);""",
          )
          replace_once(
              rtf,
              """        if let Some((key, level, number, label)) = entry {
            self.list_run.push(ListEntry {""",
              """        if let Some((key, level, number, label)) = entry {
            if key.marker.ordered()
                && let Some(label) = label.as_ref()
            {
                self.budget.charge_text(label.len())?;
                self.budget.charge_text_run()?;
            }
            self.list_run.push(ListEntry {""",
          )
          replace_once(
              rtf,
              """    fn end_cell(&mut self, depth: usize) -> Result<(), ConvertError> {
        self.budget.charge_cell()?;""",
              """    fn end_cell(&mut self, depth: usize) -> Result<(), ConvertError> {
        if let Some(error) = self.materialization_error.take() {
            return Err(error);
        }
        self.budget.charge_cell()?;""",
          )
          replace_once(
              rtf,
              """    #[test]
    fn rtf_cell_materialization_is_bounded() {
        let budget = MaterializationBudget::with_limits(1024, 1024, 1, 10);
        let error =
            parse_with_budget(br"{\\rtf1\\trowd\\cellx1000\\cellx2000 a\\cell b\\cell\\row}", budget)
                .unwrap_err();
        assert_eq!(rtf_resource_limit_name(error), "max_materialized_cells");
    }
}""",
              """    #[test]
    fn rtf_cell_materialization_is_bounded() {
        let budget = MaterializationBudget::with_limits(1024, 1024, 1, 10);
        let error =
            parse_with_budget(br"{\\rtf1\\trowd\\cellx1000\\cellx2000 a\\cell b\\cell\\row}", budget)
                .unwrap_err();
        assert_eq!(rtf_resource_limit_name(error), "max_materialized_cells");
    }

    #[test]
    fn rtf_generated_list_labels_are_bounded() {
        let budget = MaterializationBudget::with_limits(4096, 4, 10, 10);
        let error = parse_with_budget(
            br"{\\rtf1{\\*\\listtable{\\list{\\listlevel\\levelnfc0\\levelstartat1{\\leveltext \\'03\\'00.\\'00;}{\\levelnumbers \\'01\\'03;}}\\listid1}}{\\listoverridetable{\\listoverride\\listid1\\listoverridecount0\\ls1}}\\pard\\ls1\\ilvl0 item\\par}",
            budget,
        )
        .unwrap_err();
        assert_eq!(rtf_resource_limit_name(error), "max_materialized_text_bytes");
    }

    #[test]
    fn pending_text_limit_precedes_cell_limit() {
        let budget = MaterializationBudget::with_limits(1024, 1, 0, 10);
        let error =
            parse_with_budget(br"{\\rtf1\\trowd\\cellx1000 ab\\cell\\row}", budget).unwrap_err();
        assert_eq!(rtf_resource_limit_name(error), "max_materialized_text_bytes");
    }
}""",
          )

      - name: Format
        run: cargo fmt --all

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Test
        run: cargo test --locked

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Commit verified fixes
        id: commit
        run: |
          rm -f .github/workflows/agent-fix-review.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/formats/csv.rs src/formats/rtf/mod.rs .github/workflows/agent-fix-review.yml
          git commit -m "fix: address materialization review feedback"
          git push origin HEAD:fix/bound-csv-rtf-materialization
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Report success
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          COMMIT_SHA: ${{ steps.commit.outputs.sha }}
        run: gh pr comment "$PR_NUMBER" --body "SUCCESS: review fixes applied and verified. Commit: \`$COMMIT_SHA\`. Checks: rustfmt, cargo test --locked, clippy --workspace --all-targets --all-features with warnings denied."

      - name: Report failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: gh pr comment "$PR_NUMBER" --body "FAILURE: the temporary review-fix workflow did not complete. Run: $RUN_URL"
